[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evm-inventory"
version = "0.1.0"
description = "Read-only EVM wallet inventory"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27,<1", "openpyxl>=3.1,<4"]

[project.scripts]
evm-inventory = "evm_inventory.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/evm_inventory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
